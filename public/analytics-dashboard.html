<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Interactive Analytics Dashboard | Aaron Dev</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .top-bar {
            height: 48px;
            background: #0b1120;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: #fff;
        }
        .top-bar a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .top-bar a:hover {
            color: #93c5fd;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: 0.2px;
        }
        .badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 9999px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .iframe-container {
            width: 100%;
            height: calc(100% - 48px);
            background: #020617;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/projects">&larr; Back to Portfolio Projects</a>
        <span class="title">Power BI Interactive Analytics Dashboard</span>
        <span class="badge">Live Report</span>
    </div>
    <div class="iframe-container">
        <iframe title="Power BI Analytics Dashboard" src="https://app.powerbi.com/reportEmbed?reportId=2f7cecd7-0e5c-454b-82c7-0baebf1e575a&autoAuth=true&ctid=e119904a-9928-476d-a28e-feda285aba69" frameborder="0" allowFullScreen="true"></iframe>
    </div>
</body>
</html>
